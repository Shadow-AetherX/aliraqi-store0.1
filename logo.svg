  <path d="M60 60 L60 98" stroke="#fff" stroke-opacity=".18" stroke-width="1.5"/>
  <!-- little star: quality mark -->
  <path d="M60 71.5 l2.6 5.3 5.8.85 -4.2 4.1 1 5.8 -5.2-2.75 -5.2 2.75 1-5.8 -4.2-4.1 5.8-.85z" fill="url(#gold)" transform="translate(0 -1)"/>
